name: Check pull request

# Every pull request (including ones opened by agents) must build and pass every test before it is merged.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the site bundles and run every test
        run: npm test
      - name: Check every lesson against the template
        run: node scripts/check-lessons.cjs
